name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run repository gates
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          gate_args=()
          if [ "${GATE_BASE:?Missing Git comparison base}" != 0000000000000000000000000000000000000000 ]; then
            if ! git cat-file -e "${GATE_BASE}^{commit}"; then
              git fetch --no-tags origin "$GATE_BASE"
            fi
            gate_args=(--base "$GATE_BASE")
          fi
          PYTHONPATH=src python3 -m code_factory gate --repo . "${gate_args[@]}"
      - name: Run offline quickstart
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: PYTHONPATH=src python3 examples/quickstart/run_mock_demo.py
