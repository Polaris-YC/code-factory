name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run repository gates
        run: PYTHONPATH=src python3 -m code_factory gate --repo .
      - name: Run offline quickstart
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: PYTHONPATH=src python3 examples/quickstart/run_mock_demo.py
